{% extends 'subscriptions/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">Подтверждение email</h4>
                </div>
                <div class="card-body">
                    {% if confirmation %}
                        <p>Пожалуйста, подтвердите ваш email, перейдя по ссылке в письме.</p>
                    {% else %}
                        <p>Ссылка подтверждения недействительна или истекла.</p>
                    {% endif %}
                    <a href="{% url 'account_login' %}" class="btn btn-primary">Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
