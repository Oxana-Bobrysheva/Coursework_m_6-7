{% extends 'subscriptions/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">Проверьте вашу почту</h4>
                </div>
                <div class="card-body text-center">
                    <p>Мы отправили вам email с инструкциями по сбросу пароля. Проверьте вашу почту (и папку спам, если не найдете).</p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary">Вернуться ко входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
