{% extends 'subscriptions/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Статистика рассылок</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Всего рассылок</h5>
                    <h2 class="text-primary">{{ total_mailings }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Активных рассылок</h5>
                    <h2 class="text-success">{{ active_mailings }}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title">Завершенных рассылок</h5>
                    <h2 class="text-secondary">{{ completed_mailings }}</h2>
                </div>
            </div>
        </div>
    </div>
    <a href="{% url 'service:mailing_list' %}" class="btn btn-secondary mt-3">Назад к рассылкам</a>
</div>
{% endblock %}
