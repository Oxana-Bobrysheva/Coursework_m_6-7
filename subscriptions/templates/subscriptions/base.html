{% load static %}

<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Обояшки{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon" />
    <style>
.styled-form p {                       /* every <p> that Django wraps around a field */
    margin: 0 0 1.2rem 0;
    border: none;
    padding: .6rem .8rem;
    border-radius: 33px;
    display: flex;
    flex-direction: column;
}
.styled-form input {
    padding-left: 1rem; /* Adjust the value as needed */
}
.styled-form label {                   /* label on top */
    font-weight: 500;
    margin-bottom: .3rem;
}

.styled-form input,
.styled-form textarea,
.styled-form select {
    border: 1px solid #4bbbb4;                       /* remove browser default borders */
    outline: none;
    border-radius: 33px;
    width: 100%;
    font-size: 1rem;
    padding: .3rem 0;
    background: white;
}
.styled-form textarea {
    min-height: 60px;
    max-height: 200px;  /* Optional */
    resize: vertical;
    border: 1px solid #4bbbb4; /* Match other input borders */
    padding: .3rem;     /* Add padding */
    padding-left: 1rem;
}
.styled-form input {
    padding-left: 1rem; /* Adjust the value as needed */
        }
</style>
</head>
<body>
    <header>
        <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 border-bottom box-shadow"
             style="background-color: #4bbbb4;">
            <img src="{% static 'img/Logo.jpg' %}" alt="Логотип">
            {% include "subscriptions/menu.html" %}
        </div>
    </header>

    <main role="main" class="container" style="background-color: #ffffe0;">
        {% block content %}
        <!-- Контент страницы -->
        {% endblock %}
    </main>

    <footer class="pt-4 my-md-5 pt-md-5 border-top" style="background-color: #4bbbb4;">
        <div class="row">
            <div class="col-12 col-md text-center">
                Обояшки
                <small class="d-block mb-3 text-muted">&copy; 2025</small>
            </div>
            <div class="col-3 col-md">
                <h5>Категории</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="#">Рассылки</a></li>
                    <li><a class="text-muted" href="#">Телеграм боты</a></li>
                    <li><a class="text-muted" href="#">Полезные утилиты</a></li>
                </ul>
            </div>
            <div class="col-3 col-md">
                <h5>Дополнительно</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="#">Мы пишем</a></li>
                </ul>
            </div>
            <div class="col-3 col-md">
                <h5>О нас</h5>
                <ul class="list-unstyled text-small">
                    <li><a class="text-muted" href="/contacts/">Контакты</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
