{% extends "subscriptions/base.html" %}

{% block title %}Добавить подписчика{% endblock %}

{% block content %}

    <h1>Сформируйте своё новое сообщение-рассылку</h1>
    <form method="post" enctype="multipart/form-data" class="styled-form">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button class="p-2 btn btn-custom" type="submit" style="margin-bottom: 1.5rem;">Сохранить</button>
        <a href="{% url 'messages_list' %}" class="p-2 btn btn-custom" style="margin-bottom: 1.5rem;">Назад</a>
    </form>

{% endblock %}
