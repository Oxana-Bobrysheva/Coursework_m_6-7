<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success</title>
    <style>
        /* Simple styling for the message card */
        .message-card {
            border: 1px solid #4CAF50;
            background-color: #f9f9f9;
            padding: 20px;
            margin: 20px auto;
            width: 300px;
            text-align: center;
            border-radius: 5px;
        }
    </style>
    <script>
        // Redirect to the main page after 2 seconds
        setTimeout(function() {
            window.location.href = '/contacts/';  // Change this to your main page URL
        }, 2000);
    </script>
</head>
<body>
    <div class="message-card">
        <h2>Спасибо, {{ name }}!</h2>
        <p>Ваше сообщение получено.</p>
    </div>
</body>
</html>
