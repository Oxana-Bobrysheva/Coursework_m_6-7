{% extends 'subscriptions/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">Удаление рассылки</h4>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить рассылку #{{ object.id }}?</p>
                    <p><strong>Сообщение:</strong> {{ object.message.subject_of_the_letter }}</p>
                    <p><strong>Получателей:</strong> {{ object.subscribers.count }}</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{% url 'subscriptions:mailing_list' %}" class="btn btn-secondary me-md-2">
                                Отмена
                            </a>
                            <button type="submit" class="btn btn-danger">
                                Удалить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
